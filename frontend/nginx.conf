# Static site + API reverse proxy. TLS is terminated in front of this container (HSTS is set there).
# nginx drops server-level add_header lines in any location that sets its own, so the security headers are repeated in
# every location that serves the app. The Content-Security-Policy must match frontend/csp.ts (checked by a unit test).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;   # >= ATLAS_MAX_UPLOAD_BYTES (5 MiB)

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  location /api/ {
    proxy_pass http://backend:8000;   # the API sets its own security headers and CSP
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }

  location / {   # single-page-app fallback
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
  }
}
