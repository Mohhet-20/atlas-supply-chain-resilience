[project]
name = "atlas-backend"
version = "0.1.0"
description = "ATLAS - Global Supply Chain Resilience Intelligence Platform (backend)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "error",
    # Starlette 1.x prefers httpx2 for TestClient; the tests use HTTPX until that migration.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Long user-facing message/remediation strings in the registry modules are kept on one line for greppability.
"app/registry/*" = ["E501"]
"app/integrations/*" = ["E501", "E731", "S101"]
"app/models/integrations.py" = ["E501"]
"app/api/v1/intcommon.py" = ["E501"]
"app/api/v1/integrations.py" = ["E501"]
